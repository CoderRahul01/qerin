[package]
name = "qerin_vault"
version = "0.1.0"
description = "Qerin Autonomous Agent Vault with On-Chain Spend Limits and x402 Micropayments"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "qerin_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
