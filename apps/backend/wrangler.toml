name = "qerin-backend"
main = "src/index.ts"
compatibility_date = "2025-04-01"
# nodejs_compat_populate_process_env is on by default for dates >= 2025-04-01,
# listed explicitly since every file here reads secrets via process.env
# (lazily, at request time — see wallet.ts) rather than threading Hono's `c.env`.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# ── Architecture: Monolithic Cloudflare Workers + Firebase ──────────────────
# This single Workers deployment is the entire Qerin backend:
#   • HTTP API layer — Hono (src/index.ts)
#   • Database — Firebase Firestore (free Spark plan, accounts/balances/waitlist)
#   • LLM synthesis — NVIDIA NIM API
#   • On-chain payments — x402 / Base USDC
#   • On-chain audit log — QerinReceiptRegistry contract
# No Railway, no Neon, no separate microservices.
# ────────────────────────────────────────────────────────────────────────────

# Non-secret defaults. Sensitive values are stored with `wrangler secret put`:
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT   <- Firebase Admin SDK JSON (minified)
#   wrangler secret put QERIN_WALLET_PRIVATE_KEY
#   wrangler secret put NVIDIA_API_KEY
#   wrangler secret put QERIN_INTERNAL_SECRET
#   wrangler secret put CDP_API_KEY_ID
#   wrangler secret put CDP_API_KEY_SECRET
[vars]
QERIN_NETWORK = "mainnet"
QERIN_LLM_MODEL = "meta/llama-3.3-70b-instruct"
QERIN_REGISTRY_ADDRESS_BOTCHAIN = "0xb35788922a5b9C8938dE8AEDf725b88D26eEEa45"

# Free-tier rate limiting binding (Cloudflare Workers native), applied to
# both /v1/answer and /v1/paid/answer in src/index.ts. 20 requests per
# 60-second window per client IP.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Stricter dedicated bucket for /v1/account/topup/demo-claim (the free
# Ecosystem Pass claim) only — NOT crypto-confirm, which legitimately
# retries several times while a real transaction confirms. 5 attempts per
# 10-minute window per client IP (see resolveClientIp in src/index.ts).
[[unsafe.bindings]]
name = "TOPUP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 600 }

